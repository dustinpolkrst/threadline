name: CI

on:
  pull_request:
  push:
    branches: ["master", "main"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key-with-enough-length-for-django-checks
      THREADLINE_FIELD_ENCRYPTION_KEY: ci-field-encryption-key-with-enough-length
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest -q
