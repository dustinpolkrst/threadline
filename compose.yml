services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-threadline}
      POSTGRES_USER: ${POSTGRES_USER:-threadline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threadline}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-threadline} -d ${POSTGRES_DB:-threadline}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${WEB_CONCURRENCY:-2} --timeout ${GUNICORN_TIMEOUT:-60}"
    env_file: .env
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  celery:
    build: .
    command: celery -A config worker -l ${CELERY_LOG_LEVEL:-INFO}
    user: threadline
    env_file: .env
    volumes:
      - media_data:/app/media
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
