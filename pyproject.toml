[project]
name = "threadline"
version = "0.1.0"
description = "Self-hostable CRM, ticketing, and time tracking for software support teams."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6.3",
    "django>=6.0.5",
    "django-environ>=0.13.0",
    "djangorestframework>=3.17.1",
    "factory-boy>=3.3.3",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "redis>=7.4.0",
    "whitenoise>=6.12.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
