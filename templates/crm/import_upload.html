{% extends "base.html" %}
{% block content %}
<div class="mb-5">
  <div class="tl-kicker">CRM</div>
  <h1 class="text-2xl font-semibold">CSV import</h1>
  <p class="text-sm text-slate-500">Import organizations or contacts from a UTF-8 CSV file.</p>
</div>
<div class="tl-panel max-w-xl p-5">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="tl-button">Preview import</button>
  </form>
</div>
{% endblock %}
