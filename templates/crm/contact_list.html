{% extends "base.html" %}
{% block content %}
<div class="mb-4 flex items-center justify-between"><h1 class="text-2xl font-semibold">Contacts</h1><a class="bg-blue-700 px-3 py-2 text-sm text-white" href="{% url 'contact_create' %}">New contact</a></div>
<div class="border border-slate-200 bg-white divide-y divide-slate-100">{% for contact in contacts %}<a class="block p-3 hover:bg-slate-50" href="{% url 'contact_detail' contact.pk %}"><div class="font-medium">{{ contact.name }}</div><div class="text-sm text-slate-500">{{ contact.email }} · {{ contact.organization }}</div></a>{% empty %}<div class="p-4 text-slate-500">No contacts.</div>{% endfor %}</div>
{% endblock %}
