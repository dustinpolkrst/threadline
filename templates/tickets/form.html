{% extends "base.html" %}
{% block content %}
<div class="tl-panel max-w-3xl p-6">
  <div class="mb-5">
    <div class="tl-kicker">Ticket</div>
    <h1 class="tl-page-title">{{ title }}</h1>
  </div>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="tl-button">Save</button>
  </form>
</div>
{% endblock %}
