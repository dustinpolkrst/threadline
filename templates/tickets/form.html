{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl border border-slate-200 bg-white p-6">
  <h1 class="mb-4 text-xl font-semibold">{{ title }}</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="bg-blue-700 px-3 py-2 text-sm font-medium text-white">Save</button>
  </form>
</div>
{% endblock %}
