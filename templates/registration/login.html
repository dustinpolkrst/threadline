{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-sm border border-slate-200 bg-white p-6">
  <h1 class="mb-4 text-xl font-semibold">Sign in</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="w-full bg-blue-700 px-3 py-2 text-sm font-medium text-white">Sign in</button>
  </form>
</div>
{% endblock %}
